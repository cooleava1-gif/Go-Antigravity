<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!--EASYAG_BOOT_TOKEN-->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go-Antigravity · 本机 API</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 10%, #1a3550 0, #0b1220 48%, #070d17 100%); color: #e8eef9; font-family: "Segoe UI Emoji", "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    main { width: min(560px, calc(100% - 32px)); padding: 28px 30px; border: 1px solid #2b3b52; border-radius: 18px; background: linear-gradient(180deg, #15243a, #101b2c); box-shadow: 0 18px 60px rgba(0,0,0,.38); }
    .eyebrow { color: #5cc8ff; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 10px 0 14px; font-size: 24px; }
    p { color: #b7c6da; line-height: 1.75; margin: 10px 0; }
    .status { margin-top: 18px; padding: 12px 14px; border: 1px solid #29455d; border-radius: 12px; background: #10283a; color: #d4eaff; font-size: 13px; line-height: 1.65; }
    strong { color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">🚀 GO-ANTIGRAVITY · LOCAL HANDSHAKE</div>
    <h1>这是本机 API 握手页，不是桌面前端</h1>
    <p>若旧 WebView 或旧标签页显示此页，请关闭旧窗口，使用 <strong>Go-Antigravity.exe</strong> 或 <strong>Start-Go-Antigravity.cmd</strong> 启动新的 PyQt6 桌面端；复用的后端服务需要按 FRONTEND.md 的说明一并重启。</p>
    <div class="status">🔎 诊断提示：手机远程 / cloudflared 只代理 127.0.0.1:3082 的手机网页，不设置桌面全局代理，也不向 Antigravity 注入 CDP。这里保留的 <strong>会话握手标记</strong>只用于本机会话握手。</div>
  </main>
</body>
</html>
