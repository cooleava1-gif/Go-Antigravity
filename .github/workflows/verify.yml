name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
      GO_ANTIGRAVITY_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm --prefix backend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r desktop-qt/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify backend
        run: npm --prefix backend run verify
      - name: Verify bootstrap without real installation
        shell: pwsh
        run: ./scripts/bootstrap-tests.ps1
      - name: Verify desktop with synthetic data
        shell: pwsh
        run: |
          Get-ChildItem desktop-qt/test_*.py | Sort-Object Name | ForEach-Object {
            python -B $_.FullName -v
            if ($LASTEXITCODE -ne 0) { throw "Failed: $($_.Name)" }
          }
          python -B desktop-qt/smoke_test.py --output "$env:RUNNER_TEMP/go-antigravity-qa"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build optional native launcher
        shell: pwsh
        run: ./desktop-qt/build-launcher.ps1
