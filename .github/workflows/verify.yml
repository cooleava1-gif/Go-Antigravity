name: Windows verification

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']  # The release workflow verifies the tag via workflow_call.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Node ${{ matrix.node-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.13.0', '24.x']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      GO_ANTIGRAVITY_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        shell: pwsh
        run: npm --prefix backend ci
      - name: Verify backend
        shell: pwsh
        run: |
          node -e "const db = new (require('node:sqlite').DatabaseSync)(':memory:'); db.prepare('SELECT 1').get(); db.close()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix backend run verify

  desktop:
    name: Desktop and bootstrap
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
      GO_ANTIGRAVITY_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm --prefix backend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r desktop-qt/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows process isolation, bootstrap and package rules
        shell: powershell
        run: |
          ./scripts/bootstrap-tests.ps1
          ./scripts/windows-process-tests.ps1
          ./scripts/package-rules-tests.ps1
      - name: Verify desktop with synthetic data
        shell: pwsh
        run: |
          Get-ChildItem desktop-qt/test_*.py | Sort-Object Name | ForEach-Object {
            python -B $_.FullName -v
            if ($LASTEXITCODE -ne 0) { throw "Failed: $($_.Name)" }
          }
          python -B desktop-qt/smoke_test.py --output "$env:RUNNER_TEMP/go-antigravity-qa"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify package source fingerprint, release manifest and updater install flow (Windows PowerShell 5.1)
        shell: powershell
        run: |
          foreach ($required in @('./scripts/package-source-tests.ps1', './scripts/update-install-tests.ps1')) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing required test script: $required" }
          }
          ./scripts/package-source-tests.ps1
          ./scripts/update-install-tests.ps1
      - name: Verify package source fingerprint, release manifest and updater install flow (PowerShell 7)
        shell: pwsh
        run: |
          foreach ($required in @('./scripts/package-source-tests.ps1', './scripts/update-install-tests.ps1')) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing required test script: $required" }
          }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/package-source-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/update-install-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build optional native launcher
        shell: pwsh
        run: ./desktop-qt/build-launcher.ps1
